<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix-Game 2.0 Real-Time Interface</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #1a1a1a;
            color: white;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .video-container {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }
        .video-panel {
            flex: 1;
            background-color: #2a2a2a;
            border-radius: 10px;
            padding: 20px;
        }
        .video-stream {
            width: 100%;
            height: 400px;
            background-color: #000;
            border-radius: 5px;
            object-fit: contain;
        }
        .controls {
            background-color: #2a2a2a;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .control-group {
            margin-bottom: 20px;
        }
        .control-group h3 {
            margin-bottom: 10px;
            color: #00ff00;
        }
        .button-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .control-btn {
            padding: 15px;
            background-color: #333;
            border: 2px solid #555;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.2s;
        }
        .control-btn:hover {
            background-color: #444;
            border-color: #00ff00;
        }
        .control-btn.active {
            background-color: #00ff00;
            border-color: #00ff00;
            color: black;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #ccc;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            background-color: #333;
            border: 1px solid #555;
            border-radius: 5px;
            color: white;
        }
        .start-btn {
            width: 100%;
            padding: 15px;
            background-color: #00ff00;
            border: none;
            border-radius: 5px;
            color: black;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .start-btn:hover {
            background-color: #00cc00;
        }
        .status {
            text-align: center;
            padding: 10px;
            background-color: #333;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .status.generating {
            background-color: #006600;
        }
        .status.error {
            background-color: #660000;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎮 Matrix-Game 2.0 Real-Time Interface</h1>
            <p>Interactive World Generation with Live Controls</p>
        </div>

        <div class="status" id="status">
            Ready to start generation
        </div>

        <div class="controls">
            <div class="input-group">
                <label for="imagePath">Image Path:</label>
                <input type="text" id="imagePath" placeholder="Enter path to your starting image"
                       value="demo_images/universal/0000.png">
            </div>
            <button class="start-btn" onclick="startGeneration()">🚀 Start Real-Time Generation</button>
        </div>

        <div class="video-container">
            <div class="video-panel">
                <h3>Live Video Stream</h3>
                <img id="videoStream" class="video-stream" src="/video_feed" alt="Video Stream">
            </div>
        </div>

        <div class="controls">
            <div class="control-group">
                <h3>🎮 Movement Controls (WASD)</h3>
                <div class="button-grid">
                    <button class="control-btn" data-action="w">W<br>Forward</button>
                    <button class="control-btn" data-action="s">S<br>Backward</button>
                    <button class="control-btn" data-action="a">A<br>Left</button>
                    <button class="control-btn" data-action="d">D<br>Right</button>
                    <button class="control-btn" data-action="q">Q<br>Stop</button>
                </div>
            </div>

            <div class="control-group">
                <h3>📷 Camera Controls (IJKL)</h3>
                <div class="button-grid">
                    <button class="control-btn" data-action="i">I<br>Up</button>
                    <button class="control-btn" data-action="k">K<br>Down</button>
                    <button class="control-btn" data-action="j">J<br>Left</button>
                    <button class="control-btn" data-action="l">L<br>Right</button>
                    <button class="control-btn" data-action="u">U<br>Center</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let isGenerating = false;
        let currentAction = null;

        function updateStatus(message, type = '') {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${type}`;
        }

        function startGeneration() {
            const imagePath = document.getElementById('imagePath').value;
            if (!imagePath) {
                alert('Please enter an image path');
                return;
            }

            updateStatus('Starting generation...', 'generating');

            fetch('/start_generation', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ image_path: imagePath })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    isGenerating = true;
                    updateStatus('Generation started! Use controls below to interact.', 'generating');
                } else {
                    updateStatus('Failed to start generation', 'error');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                updateStatus('Error starting generation', 'error');
            });
        }

        function sendAction(action) {
            if (!isGenerating) return;

            fetch('/send_action', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ action: action })
            })
            .then(response => response.json())
            .then(data => {
                console.log('Action sent:', action);
            })
            .catch(error => {
                console.error('Error sending action:', error);
            });
        }

        // Button event listeners
        document.querySelectorAll('.control-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const action = this.dataset.action;

                // Update visual state
                document.querySelectorAll('.control-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');

                // Send action
                sendAction(action);

                // Remove active state after a short delay
                setTimeout(() => {
                    this.classList.remove('active');
                }, 200);
            });
        });

        // Keyboard controls
        document.addEventListener('keydown', function(event) {
            if (!isGenerating) return;

            const key = event.key.toLowerCase();
            const validKeys = ['w', 's', 'a', 'd', 'q', 'i', 'j', 'k', 'l', 'u'];

            if (validKeys.includes(key)) {
                event.preventDefault();
                sendAction(key);

                // Visual feedback
                const btn = document.querySelector(`[data-action="${key}"]`);
                if (btn) {
                    btn.classList.add('active');
                    setTimeout(() => btn.classList.remove('active'), 200);
                }
            }
        });

        // Auto-refresh video stream
        setInterval(() => {
            const videoStream = document.getElementById('videoStream');
            videoStream.src = '/video_feed?' + new Date().getTime();
        }, 100);
    </script>
</body>
</html>
